[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lexis-cli"
# Version is derived from the git tag by hatch-vcs (see [tool.hatch.version]):
# exactly `X.Y.Z` on a `vX.Y.Z` commit, `X.Y.(Z+1).devN+g<sha>` after it.
dynamic = ["version"]
description = "Ossie-native semantic layer: author models once, transpile to warehouse-native SQL and BI/AI consumer formats"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Puspendu Banerjee" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/PuspenduBanerjee/Lexis"
Repository = "https://github.com/PuspenduBanerjee/Lexis"
Issues = "https://github.com/PuspenduBanerjee/Lexis/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=1.9,<2",
    "anyio>=4.0",
    "duckdb>=1.0",
    "snowflake-connector-python>=3.12",
]
dev = [
    "pytest>=8.0",
    "duckdb>=1.0",
    "httpx2>=2.0",
    "jsonschema>=4.0",
    "hypothesis>=6.100",
    # Independent LookML parser, used by tests/test_lookml_emitter.py to verify
    # what our hand-rolled writer emits actually parses. Deliberately dev-only:
    # the emitter itself takes no runtime dependency to produce LookML.
    "lkml>=1.3",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "duckdb>=1.0",
    "snowflake-connector-python>=3.12",
    "mcp>=1.9,<2",
]

[project.scripts]
lexis = "lexis.cli:main"

[tool.hatch.version]
source = "vcs"
# `v1.2.3` -> `1.2.3`. hatch-vcs strips the leading `v` by default.

[tool.hatch.build.targets.wheel]
packages = ["src/lexis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["third_party", ".git", ".venv", "node_modules"]
filterwarnings = [
    # Starlette's own TestClient (as of 1.6.0, the latest release) imports a
    # since-deprecated anyio alias internally - nothing on our side to fix,
    # drop this once a starlette release removes the alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
